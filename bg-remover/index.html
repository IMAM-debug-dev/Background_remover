<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERAGE.BG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="logo">
        <div>
            <img src="logo.svg" alt="">
        <h1>ERAGE.BG</h1>
        </div>
        <h4>Owner:Hasan imam <br>Softwear developer</h4>
    </div>

    <div class="main">
        <div class="style1">
       <div class="image">
         <div class="image1"><img src="non bg-remove.jpg" class="withbg" alt=""></div>
        <div class="image2"><img src="bg-remober.png" class="nonbg" alt=""></div>
       </div>

       <div class="text">Remove image background & Download PNG </div>
        </div>
        <div class="style2">
            <div class="upload-image">
                <div class="inner-upload-image">
                    <img src="" class="imputimg" alt="">
                    <input type="file" id="fileflic" accept="image/*" hidden>
                    <img src="plus.svg" id="icon" alt="">
                    <span>Upload image</span>
                </div>
                <button id="upload">Upload</button>
            </div>
        </div>
        <div class="res">
            <div class="result">
            <div class="mainbox">
                <div class="resultimg1"><img src="" alt=""></div>
                <div class="resultimg2"><img src="" alt=""></div>
            </div>
          
        </div>
          <div class="btn">
                <button class="btn1">Download</button>
                <button class="btn2">Reset</button>
            </div>
        </div>
    </div>


    <script src="app.js"></script>
</body>
</html>
